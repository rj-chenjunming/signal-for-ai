<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>多端口 dsh 指示灯 · 灯带预览</title>
<style>
/**
 * 渲染层共用样式 —— 深浅色自适应（PRD §7.3：跟随 nativeTheme）。
 *
 * 【状态色的单一来源约束】（架构 §8.1）
 * 色值只允许在 shared/constants.ts 的 STATUS_COLOR 定义一次。
 * 本文件通过 CSS 变量接收主进程/JS 注入的色值（见 overlay.ts / panel.ts），
 * **不硬编码任何状态色**，避免出现「CSS 一套、常量一套」的漂移。
 *
 * 动画类名与 constants.ts 的 STATUS_ANIMATION 一一对应：
 *   anim-steady / anim-breathe-slow / anim-breathe / anim-blink-fast
 *   / anim-flash-once / anim-alarm
 */

/* ============================================================================
 * 基础
 * ==========================================================================*/

:root {
  /* 这些变量由 JS（overlay.ts / panel.ts）在收到快照后写入真实状态色 */
  --status-idle: #6b7280;
  --status-starting: #93c5fd;
  --status-running: #3b82f6;
  --status-waiting: #f59e0b;
  --status-success: #22c55e;
  --status-failed: #ef4444;
  --status-unknown: #4b5563;

  --panel-bg: #1f2430;
  --panel-fg: #e6e9ef;
  --panel-muted: #9aa4b8;
  --panel-border: #333b4d;
  --panel-hover: #262c3b;

  --lamp-size: 28px;
  --lamp-opacity: 0.92;

  color-scheme: dark;
}

/* 浅色桌面主题：Electron 会把 prefers-color-scheme 同步过来 */
@media (prefers-color-scheme: light) {
  :root {
    --panel-bg: #f7f8fa;
    --panel-fg: #1f2430;
    --panel-muted: #5b6478;
    --panel-border: #d8dde8;
    --panel-hover: #eef1f6;
    color-scheme: light;
  }
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  font-family:
    -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei UI', 'Microsoft YaHei',
    system-ui, sans-serif;
  -webkit-user-select: none;
  user-select: none;
}

/* ============================================================================
 * 悬浮灯（overlay 窗口）
 * ==========================================================================*/

.overlay-body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: transparent;
}

.lamp-stage {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
}

/* 拖拽区：-webkit-app-region 由 Chromium 直接处理，零 IPC 开销（架构 §1.3） */
.lamp-drag {
  -webkit-app-region: drag;
  display: flex;
  align-items: center;
  justify-content: center;
  width: calc(var(--lamp-size) + 16px);
  height: calc(var(--lamp-size) + 16px);
}

/* 点击区：必须从拖拽区里挖出来，否则点击会被 drag 吃掉 */
.lamp-core {
  -webkit-app-region: no-drag;
  position: relative;
  width: var(--lamp-size);
  height: var(--lamp-size);
  cursor: pointer;
}

.lamp-dot {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  /* background-color 由 JS 写入真实状态色 */
  background-color: var(--status-idle);
  opacity: var(--lamp-opacity);
  box-shadow: 0 0 0 1px rgb(11 18 32 / 55%), 0 2px 6px rgb(0 0 0 / 35%);
  transition: background-color 220ms ease;
}

.lamp-core:hover .lamp-dot {
  opacity: 1;
}

/* ===========================================================================
 * 多端口灯带（设计决策 D6 / D9）
 *
 * 布局：总灯在上（略大），下面竖排每端口一盏小灯 + 端口号标签。
 *   ◆            <- 总灯（聚合所有端口）
 *   ● 3080       <- 每端口一盏 14px 小灯
 *   ● 13080
 *
 * 为什么竖排而不是横排：端口号要跟着灯走，横排会把窗口撑得很宽、
 * 盖住编辑器更多区域；竖排整体约 76px 宽，只占屏幕右侧一条。
 *
 * 色值一律走 --status-* 变量，本文件不出现字面色值（架构 §8.1 单一来源）。
 * ===========================================================================*/

.lamp-strip {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  padding: 6px 8px;
  /* 半透明底板：让灯在浅色和深色桌面上都能看清 */
  background: rgb(11 18 32 / 42%);
  border-radius: 10px;
  backdrop-filter: blur(2px);
}

/* 总灯：代表所有端口的聚合态，略大于端口灯 */
.strip-master {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-bottom: 5px;
  margin-bottom: 1px;
  border-bottom: 1px solid rgb(255 255 255 / 14%);
  width: 100%;
}

.strip-master-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  flex: none;
  background-color: var(--status-idle);
  box-shadow: 0 0 0 1px rgb(11 18 32 / 55%), 0 2px 6px rgb(0 0 0 / 35%);
  transition: background-color 220ms ease;
}

.strip-master-label {
  font: 600 10px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
  color: rgb(226 232 240 / 92%);
  letter-spacing: 0.02em;
}

/* 单个端口一行 */
.strip-row {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

.strip-row:hover .strip-dot {
  opacity: 1;
}

.strip-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  flex: none;
  /* background-color 由 JS 按状态写入 */
  background-color: var(--status-idle);
  opacity: var(--lamp-opacity);
  box-shadow: 0 0 0 1px rgb(11 18 32 / 55%), 0 1px 4px rgb(0 0 0 / 32%);
  transition: background-color 220ms ease;
}

.strip-port {
  font: 500 10px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
  color: rgb(203 213 225 / 88%);
  white-space: nowrap;
}

/* 失联/未知时把标签也压暗，避免误以为正常 */
.strip-row[data-status="unknown"] .strip-port {
  color: rgb(148 163 184 / 60%);
}

/* 端口过多时允许滚动，而不是把窗口撑到屏幕外 */
.strip-rows {
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-height: 60vh;
  overflow-y: auto;
  scrollbar-width: none;
}

.strip-rows::-webkit-scrollbar {
  display: none;
}

/* 没有端口任务时给一句提示，而不是一片空白 */
.strip-empty {
  font: 500 10px/1.4 ui-sans-serif, system-ui, sans-serif;
  color: rgb(148 163 184 / 78%);
  max-width: 120px;
}

/* 灯带模式下把徽标挪到总灯角上 */
.strip-master .lamp-badge {
  position: static;
  margin-left: 2px;
}

/* 数量徽标（PRD P0-5：running=0 时不显示） */
.lamp-badge {
  position: absolute;
  top: -5px;
  right: -6px;
  min-width: 15px;
  height: 15px;
  padding: 0 3px;
  border-radius: 8px;
  background: rgb(17 24 39 / 92%);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  line-height: 15px;
  text-align: center;
  box-shadow: 0 1px 2px rgb(0 0 0 / 40%);
}

.lamp-badge[hidden] {
  display: none;
}

.lamp-tooltip {
  position: absolute;
  left: 50%;
  bottom: 2px;
  transform: translateX(-50%);
  max-width: 260px;
  padding: 5px 9px;
  border: 1px solid rgb(255 255 255 / 12%);
  border-radius: 6px;
  background: rgb(17 24 39 / 94%);
  color: #e6e9ef;
  font-size: 11px;
  line-height: 1.45;
  white-space: pre-line;
  opacity: 0;
  pointer-events: none;
  transition: opacity 160ms ease;
}

.lamp-stage:hover + .lamp-tooltip,
.lamp-tooltip.show {
  opacity: 1;
}

/* ============================================================================
 * 状态动画（PRD §5.1：常亮/慢呼吸/呼吸脉冲/快闪/绿闪/双闪告警）
 * 注意：这里只定义**动效**，颜色一律走 CSS 变量，避免硬编码色值。
 * ==========================================================================*/

.anim-steady {
  animation: none;
}

.anim-breathe-slow {
  animation: breathe 3.2s ease-in-out infinite;
}

.anim-breathe {
  animation: breathe 2s ease-in-out infinite;
}

.anim-blink-fast {
  animation: blink 0.6s steps(2, start) infinite;
}

.anim-flash-once {
  animation: flash-once 1.1s ease-out 1;
}

.anim-alarm {
  animation: alarm 1.2s ease-in-out infinite;
}

@keyframes breathe {
  0%,
  100% {
    opacity: var(--lamp-opacity);
    transform: scale(1);
  }
  50% {
    opacity: 1;
    transform: scale(1.12);
  }
}

@keyframes blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.35;
  }
}

@keyframes flash-once {
  0% {
    opacity: 1;
    transform: scale(1.25);
  }
  100% {
    opacity: var(--lamp-opacity);
    transform: scale(1);
  }
}

@keyframes alarm {
  0%,
  100% {
    opacity: 1;
    transform: scale(1);
  }
  25% {
    opacity: 1;
    transform: scale(1.15);
  }
  50% {
    opacity: 0.6;
    transform: scale(1);
  }
  75% {
    opacity: 1;
    transform: scale(1.15);
  }
}

/* ============================================================================
 * 任务列表面板（panel 窗口）
 * ==========================================================================*/

.panel-body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  background: var(--panel-bg);
  color: var(--panel-fg);
  box-shadow: 0 10px 32px rgb(0 0 0 / 38%);
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 38px;
  padding: 0 8px 0 12px;
  border-bottom: 1px solid var(--panel-border);
  -webkit-app-region: drag;
}

.panel-title {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.2px;
}

.panel-header-actions {
  display: flex;
  gap: 2px;
  -webkit-app-region: no-drag;
}

.icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--panel-muted);
  font-size: 13px;
  cursor: pointer;
  transition: background 120ms ease, color 120ms ease;
}

.icon-btn:hover {
  background: var(--panel-hover);
  color: var(--panel-fg);
}

/* 摘要条 */
.panel-summary {
  display: flex;
  gap: 4px;
  padding: 7px 10px;
  border-bottom: 1px solid var(--panel-border);
  font-size: 11px;
}

.summary-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 6px;
  border-radius: 10px;
  background: var(--panel-hover);
}

.summary-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

/* 各状态的点色走 CSS 变量（由 JS 写入真实状态色） */
.summary-item[data-status='running'] .summary-dot {
  background: var(--status-running);
}
.summary-item[data-status='waiting'] .summary-dot {
  background: var(--status-waiting);
}
.summary-item[data-status='success'] .summary-dot {
  background: var(--status-success);
}
.summary-item[data-status='failed'] .summary-dot {
  background: var(--status-failed);
}

.summary-label {
  color: var(--panel-muted);
}

.summary-count {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* 任务列表：PRD §7.3 最大高度 70vh 内部滚动 */
.panel-list {
  height: calc(100vh - 38px - 34px - 26px);
  overflow-y: auto;
  overflow-x: hidden;
  padding: 4px 0;
}

.panel-list::-webkit-scrollbar {
  width: 8px;
}

.panel-list::-webkit-scrollbar-thumb {
  border: 2px solid transparent;
  border-radius: 4px;
  background: var(--panel-border);
  background-clip: content-box;
}

/* 任务行 */
.task-row {
  position: relative;
  display: grid;
  grid-template-columns: 4px 20px 1fr auto;
  gap: 8px;
  align-items: center;
  min-height: 64px;
  padding: 8px 10px 8px 6px;
  border-bottom: 1px solid var(--panel-border);
}

.task-row:last-child {
  border-bottom: none;
}

.task-row:hover {
  background: var(--panel-hover);
}

/* 左侧 8px 状态色条（PRD §7.3：左侧 8px 色条 + 状态图标） */
.task-stripe {
  width: 4px;
  height: 100%;
  min-height: 44px;
  border-radius: 2px;
  background: var(--status-idle);
}

.task-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  font-size: 13px;
  text-align: center;
}

.task-main {
  min-width: 0;
}

.task-line1 {
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.task-name {
  overflow: hidden;
  font-size: 12px;
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.task-row.unread .task-name {
  font-weight: 800;
}

/* 未读小圆点 */
.task-unread-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--panel-fg);
}

.task-meta {
  font-size: 10px;
  color: var(--panel-muted);
}

.task-meta-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.task-sub {
  overflow: hidden;
  font-size: 10px;
  color: var(--panel-muted);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.task-sub + .task-sub {
  margin-top: 2px;
}

/* 右侧耗时 */
.task-elapsed {
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--panel-muted);
  white-space: nowrap;
}

/* 行内操作按钮：PRD §7.3 要求可点区域 >= 32px */
.task-actions {
  display: flex;
  grid-column: 1 / -1;
  gap: 4px;
  justify-content: flex-end;
  margin-top: 2px;
  opacity: 0;
  transition: opacity 120ms ease;
}

.task-row:hover .task-actions,
.task-row:focus-within .task-actions {
  opacity: 1;
}

.task-action-btn {
  min-width: 32px;
  height: 26px;
  padding: 0 8px;
  border: 1px solid var(--panel-border);
  border-radius: 5px;
  background: transparent;
  color: var(--panel-muted);
  font-size: 10px;
  cursor: pointer;
  transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
}

.task-action-btn:hover {
  border-color: var(--panel-muted);
  background: var(--panel-hover);
  color: var(--panel-fg);
}

.task-action-btn.primary {
  border-color: var(--status-running);
  color: var(--status-running);
}

/* 进度条（webhook progress） */
.task-progress {
  grid-column: 2 / -1;
  height: 3px;
  margin-top: 4px;
  border-radius: 2px;
  background: var(--panel-border);
  overflow: hidden;
}

.task-progress-bar {
  height: 100%;
  border-radius: 2px;
  background: var(--status-running);
  transition: width 200ms ease;
}

/* 空态（PRD §7.3） */
.panel-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 28px 20px;
  color: var(--panel-muted);
  text-align: center;
}

.panel-empty[hidden] {
  display: none;
}

.empty-title {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--panel-fg);
}

.empty-hint {
  margin: 0;
  font-size: 11px;
  line-height: 1.6;
}

.empty-hint code {
  padding: 2px 5px;
  border-radius: 4px;
  background: var(--panel-hover);
  font-size: 10px;
  word-break: break-all;
}

.panel-footer {
  display: flex;
  align-items: center;
  height: 26px;
  padding: 0 12px;
  border-top: 1px solid var(--panel-border);
  color: var(--panel-muted);
  font-size: 10px;
}

/* 面板内轻提示（配置重载等） */
.panel-toast {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 340px;
  padding: 7px 12px;
  border: 1px solid var(--panel-border);
  border-radius: 7px;
  background: rgb(17 24 39 / 95%);
  color: #e6e9ef;
  font-size: 11px;
  box-shadow: 0 6px 18px rgb(0 0 0 / 34%);
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms ease;
}

.panel-toast.show {
  opacity: 1;
}

@media (prefers-reduced-motion: reduce) {
  .anim-breathe,
  .anim-breathe-slow,
  .anim-blink-fast,
  .anim-alarm,
  .anim-flash-once {
    animation: none;
  }
}


/* ---- 预览页专属样式（不属于产品，只用于排版截图） ---- */
body.preview {
  margin: 0;
  padding: 28px 32px 40px;
  background: #0f172a;
  color: #e2e8f0;
  font: 13px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
}
h1 { font-size: 17px; margin: 0 0 4px; font-weight: 650; }
h2 { font-size: 13px; margin: 30px 0 12px; color: #94a3b8; font-weight: 600;
     text-transform: uppercase; letter-spacing: .06em; }
.hint { color: #94a3b8; margin: 0 0 6px; font-size: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 26px; align-items: flex-start; }
.scene { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.scene figcaption { font-size: 11px; color: #94a3b8; max-width: 190px; text-align: center; }
.swatch { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 84px; }
.swatch figcaption { font-size: 11px; color: #cbd5e1; text-align: center; line-height: 1.35; }
.swatch small { color: #64748b; }
/* 预览页里让灯带不要被 body 的 flex 拉伸 */
.lamp-strip { width: auto; }
</style>
